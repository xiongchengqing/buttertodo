name: Remindify
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LR2TA2W2B4
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
targets:
  Remindify:
    type: application
    platform: iOS
    sources:
      - path: Remindify
      - path: Shared
    dependencies:
      - target: RemindifyWidget
        embed: true
    entitlements:
      path: Remindify/Remindify.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.remindify
        # iCloud KVS 同步需要付费开发者团队;升级后取消下一行注释即可启用
        # com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    info:
      path: Remindify/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleDisplayName: ButterTodo
        CFBundleURLTypes:
          - CFBundleURLName: com.example.remindify
            CFBundleURLSchemes:
              - remindify
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remindify
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RemindifyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RemindifyWidget
      - path: Shared
    entitlements:
      path: RemindifyWidget/RemindifyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.remindify
    info:
      path: RemindifyWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: ButterTodo Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remindify.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Remindify:
    build:
      targets:
        Remindify: all
    run:
      config: Debug
